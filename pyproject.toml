[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applyapp"
version = "0.1.0"
description = "Daily human-in-the-loop job application agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "google-api-python-client>=2.150",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
applyapp = "applyapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
applyapp = ["examples/seeds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
